  <g id="text_26">
   <text style="font-weight: 700; font-size: 25px; font-family: 'Microsoft YaHei'; text-anchor: start" x="61.2" y="45.36" transform="rotate(-0 61.2 45.36)">真实 q_b：输出半宽重现 TP2 原生差异</text>
  </g>
  <g id="text_27">
   <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="81" transform="rotate(-0 61.2 81)">544526f7 · 129 / 910B3 · CANN 9.2.0-beta.2 · 首步一个真实 batch / layer0 q_b_proj</text>
  </g>
  <g id="text_28">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #9d5e21" x="61.2" y="443.88" transform="rotate(-0 61.2 443.88)">M/K 固定 4096/1536；N 从 24576 改为 12288。两半各比较 50,331,648 个元素，合计 7,774 个非零差。</text>
  </g>
  <g id="text_29">
   <text style="font-size: 12.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #2d735f" x="61.2" y="484.056" transform="rotate(-0 61.2 484.056)">全宽 R 与 P 原生字节完全一致；两次 V0、两次 V1 各自零差，并分别匹配旧 TP2 的全部 768 块。</text>
  </g>
  <g id="text_30">
   <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="522.936" transform="rotate(-0 61.2 522.936)">P 与此前 FSDP 同一使用点也完全一致；本次旁路不回填训练，3步 × 8rank 的训练标量/输入/计数零差。</text>
  </g>
  <g id="text_31">
   <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="561.816" transform="rotate(-0 61.2 561.816)">数值最大差采自本次有界 CPU slab 全元素比较；旧 TP2 只存原生 SHA 与稀疏网格，未离线恢复全部数值。</text>
  </g>
  <g id="text_32">
   <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="600.696" transform="rotate(-0 61.2 600.696)">结论限于一个真实投影使用点：执行形状足以重现该局部差异；未识别具体 kernel，完整200步漂移根因仍未解决。</text>
  </g>
 </g>
