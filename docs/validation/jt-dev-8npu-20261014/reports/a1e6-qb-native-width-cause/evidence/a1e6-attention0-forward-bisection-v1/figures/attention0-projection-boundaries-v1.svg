  <g id="text_23">
   <text style="font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #9d3434" x="61.2" y="516.384" transform="rotate(-0 61.2 516.384)">q_b 的648个网格点恰好零差，但4,722个完整块不同；稀疏数值采样不能证明张量相同。</text>
  </g>
  <g id="text_24">
   <text style="font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="548.064" transform="rotate(-0 61.2 548.064)">q_b 实际 M/N/K：4096/24576/1536 → 4096/12288/1536；形状是否足以导致差异仍待因果实验。</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="579.744" transform="rotate(-0 61.2 579.744)">两侧各3步×8rank标量、输入、计数均与自身原200步前缀零差。块覆盖完整字节；网格max只覆盖采样点。</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #596b82" x="61.2" y="608.256" transform="rotate(-0 61.2 608.256)">这里只定位观测边界；未认定具体kernel或训练漂移根因，也不代表完整200步对齐通过。</text>
  </g>
