  <g id="text_22">
   <text style="font-weight: 700; font-size: 13px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #a94f20" x="61.2" y="472.032" transform="rotate(-0 61.2 472.032)">完成生产归约后的 attention 输出：2,560 / 2,560 块不同；234 / 648 个网格点不同，网格max差 0.015625</text>
